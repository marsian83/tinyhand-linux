name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 24.04 for GTK 4.14 and libadwaita 1.5 (the settings window needs 4.12 / 1.4).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace

  build:
    # The pointer is built against glibc 2.28 with cargo-zigbuild, so it runs on older
    # distros too. The tarball carries the pointer only; the settings window needs GTK.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pip install cargo-zigbuild

      - name: Build
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}.2.28

      - name: Smoke test
        if: matrix.arch == 'x86_64'
        run: ./target/${{ matrix.target }}/release/tinyhand bench --hand assets/hands/hand_lavender.png

      - name: Make the tarball
        run: |
          NAME="tinyhand-linux-${{ matrix.arch }}"
          DIR="dist/$NAME"
          mkdir -p "$DIR"
          install -m 755 "target/${{ matrix.target }}/release/tinyhand" "$DIR/tinyhand"
          cp -r assets/hands "$DIR/hands"
          cp -r packaging/icons "$DIR/icons"
          install -m 755 packaging/install.sh "$DIR/install.sh"
          cp packaging/tinyhand.desktop LICENSE README.md "$DIR/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: tinyhand-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
